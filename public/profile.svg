<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E8EC" />
      <stop offset="60%" stop-color="#D5D9E0" />
      <stop offset="100%" stop-color="#C2C7D0" />
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE6D2" />
      <stop offset="70%" stop-color="#F7D3B6" />
      <stop offset="100%" stop-color="#EBC4A4" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242226" />
      <stop offset="100%" stop-color="#121114" />
    </linearGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#252528" />
      <stop offset="40%" stop-color="#1A1A1D" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>

    <!-- Glasses Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#F3E1A6" />
      <stop offset="100%" stop-color="#C69E52" />
    </linearGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ECC675" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)" />

  <!-- Soft Studio Vignette -->
  <circle cx="300" cy="300" r="260" fill="#FFFFFF" opacity="0.45" filter="blur(50px)" />

  <!-- Person Torso / Clothing -->
  <g id="body-and-suit">
    <!-- White Dress Shirt Base -->
    <path d="M220 440 L380 440 L410 750 L190 750 Z" fill="#F8FAFC" />
    <path d="M260 440 L340 440 L345 560 L300 590 L255 560 Z" fill="#FFFFFF" />
    <!-- Shirt Collar Inner Shadow -->
    <polygon points="260,430 300,530 340,430 320,430 300,500 280,430" fill="#E2E8F0" opacity="0.7"/>

    <!-- Black Necktie -->
    <!-- Knot -->
    <polygon points="284,495 316,495 310,535 290,535" fill="#141417" filter="url(#softShadow)"/>
    <path d="M290 535 L310 535 L325 750 L275 750 Z" fill="#18181C" />
    <!-- Tie Highlight Texture -->
    <path d="M296 540 L304 540 L308 750 L292 750 Z" fill="#242429" opacity="0.5" />

    <!-- White Collar Flaps -->
    <!-- Left Collar -->
    <polygon points="230,445 285,505 284,475 255,435" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Right Collar -->
    <polygon points="370,445 315,505 316,475 345,435" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Black Suit Jacket -->
    <!-- Shoulders and Body -->
    <path d="M90 750 L120 530 C135 485 185 455 240 445 L275 515 L300 660 L325 515 L360 445 C415 455 465 485 480 530 L510 750 Z" fill="url(#suitGrad)" />

    <!-- Suit Lapels Left & Right -->
    <!-- Left Lapel -->
    <polygon points="240,445 190,520 255,595 285,670 270,550 255,510" fill="#2D2D32" stroke="#1A1A1D" stroke-width="1" />
    <!-- Right Lapel -->
    <polygon points="360,445 410,520 345,595 315,670 330,550 345,510" fill="#26262A" stroke="#1A1A1D" stroke-width="1" />

    <!-- Suit Seams & Shadows -->
    <path d="M190 520 L165 750" stroke="#121214" stroke-width="2.5" opacity="0.6"/>
    <path d="M410 520 L435 750" stroke="#121214" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Neck -->
  <g id="neck">
    <path d="M255 380 C255 425 270 470 300 480 C330 470 345 425 345 380 Z" fill="url(#skinGrad)" />
    <!-- Neck Shadow under chin -->
    <path d="M255 380 C280 415 320 415 345 380 C335 415 318 435 300 438 C282 435 265 415 255 380 Z" fill="#D9A683" opacity="0.6" />
  </g>

  <!-- Head & Face Structure -->
  <g id="head">
    <!-- Ears -->
    <!-- Left Ear -->
    <ellipse cx="202" cy="315" rx="16" ry="28" fill="#F4C7A5" transform="rotate(-5 202 315)" />
    <path d="M200 302 C194 312 195 324 203 330" stroke="#D39875" stroke-width="2.5" fill="none"/>
    <!-- Right Ear -->
    <ellipse cx="398" cy="315" rx="16" ry="28" fill="#F4C7A5" transform="rotate(5 398 315)" />
    <path d="M400 302 C406 312 405 324 397 330" stroke="#D39875" stroke-width="2.5" fill="none"/>

    <!-- Face Base (Oval/Soft Square with friendly jawline) -->
    <path d="M210 260 C210 180 390 180 390 260 C390 345 365 400 300 405 C235 400 210 345 210 260 Z" fill="url(#skinGrad)" filter="url(#softShadow)" />

    <!-- Cheek & Jaw subtle shading -->
    <path d="M215 300 C215 360 250 395 300 402 C350 395 385 360 385 300 C375 350 345 390 300 394 C255 390 225 350 215 300 Z" fill="#E8B08F" opacity="0.35"/>

    <!-- Gentle Smile / Lips -->
    <path d="M272 360 C286 368 314 368 328 360" stroke="#BE7560" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M280 361 C292 366 308 366 320 361" stroke="#D88A75" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M288 367 C296 371 304 371 312 367" stroke="#C27A68" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Nose Structure -->
    <path d="M298 280 L295 322 C295 328 290 332 284 330 C280 330 286 335 300 335 C314 335 320 330 316 330 C310 332 305 328 305 322 L302 280" fill="none" stroke="#DCA280" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="290" cy="328" rx="4" ry="2.5" fill="#CD8E6B" opacity="0.5"/>
    <ellipse cx="310" cy="328" rx="4" ry="2.5" fill="#CD8E6B" opacity="0.5"/>

    <!-- Eyes (Behind glasses) -->
    <!-- Left Eye -->
    <ellipse cx="258" cy="285" rx="14" ry="7" fill="#FFFFFF" />
    <circle cx="258" cy="285" r="5.5" fill="#2B1E1A" />
    <circle cx="256" cy="283" r="1.8" fill="#FFFFFF" />
    <path d="M244 282 C252 277 264 277 272 282" stroke="#42291F" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Right Eye -->
    <ellipse cx="342" cy="285" rx="14" ry="7" fill="#FFFFFF" />
    <circle cx="342" cy="285" r="5.5" fill="#2B1E1A" />
    <circle cx="340" cy="283" r="1.8" fill="#FFFFFF" />
    <path d="M328 282 C336 277 348 277 356 282" stroke="#42291F" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Eyebrows -->
    <path d="M236 264 C250 256 268 258 278 266" stroke="#251F22" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M322 266 C332 258 350 256 364 264" stroke="#251F22" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Modern Horn-Rimmed / Browline Eyeglasses -->
  <g id="eyewear">
    <!-- Glasses Bridge (Gold Metal) -->
    <path d="M284 278 C294 272 306 272 316 278" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glowGold)"/>
    
    <!-- Left Eyeglass -->
    <!-- Gold Lower Metal Rim -->
    <path d="M228 280 C228 312 286 312 286 280" stroke="url(#goldGrad)" stroke-width="3" fill="none" />
    <!-- Glass Lens Reflections -->
    <path d="M234 282 C236 304 278 304 280 282" fill="#E0F2FE" opacity="0.25" />
    <line x1="242" y1="284" x2="252" y2="304" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    <!-- Black Acetate Top Browline -->
    <path d="M222 274 C224 262 254 260 288 270 C290 274 286 280 282 280 C254 272 230 274 226 280 Z" fill="#18181B" stroke="#09090B" stroke-width="1.5" />
    <!-- Metal Rivet on Frame Corner -->
    <circle cx="227" cy="272" r="1.8" fill="url(#goldGrad)"/>

    <!-- Right Eyeglass -->
    <!-- Gold Lower Metal Rim -->
    <path d="M314 280 C314 312 372 312 372 280" stroke="url(#goldGrad)" stroke-width="3" fill="none" />
    <!-- Glass Lens Reflections -->
    <path d="M320 282 C322 304 364 304 366 282" fill="#E0F2FE" opacity="0.25" />
    <line x1="328" y1="284" x2="338" y2="304" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
    <!-- Black Acetate Top Browline -->
    <path d="M312 270 C346 260 376 262 378 274 C374 280 370 274 342 272 C318 280 314 274 312 270 Z" fill="#18181B" stroke="#09090B" stroke-width="1.5" />
    <!-- Metal Rivet on Frame Corner -->
    <circle cx="373" cy="272" r="1.8" fill="url(#goldGrad)"/>

    <!-- Frame Temples extending to ears -->
    <path d="M224 273 L204 290" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M376 273 L396 290" stroke="#18181B" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Hair & Bangs (Neat black hair with textured bangs) -->
  <g id="hair">
    <!-- Main Hair Volume -->
    <path d="M196 265 C186 170 240 120 300 120 C360 120 414 170 404 265 C396 230 380 200 300 195 C220 200 204 230 196 265 Z" fill="url(#hairGrad)" />

    <!-- Bangs Framing the Forehead and Eyebrows -->
    <path d="M198 250 
             C210 240 225 242 232 254 
             C238 244 252 245 258 258 
             C265 246 278 245 285 260 
             C292 248 308 248 315 260 
             C322 246 338 246 345 258 
             C352 245 368 244 374 254 
             C382 240 395 242 402 250 
             C400 170 360 130 300 130 
             C240 130 200 170 198 250 Z" 
          fill="url(#hairGrad)" filter="url(#softShadow)" />

    <!-- Hair Strands & Highlights for Realistic Depth -->
    <path d="M240 160 C270 145 330 145 360 160" stroke="#3A3840" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M260 180 C285 170 315 170 340 180" stroke="#484550" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Bottom Soft Vignette to blend into modern dark UI -->
  <rect y="680" width="600" height="70" fill="url(#suitGrad)" opacity="0.9" />
</svg>
